[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-agent"
version = "0.1.0"
description = "Local-first project brain and workflow foundation for Guardian Agent"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[project.scripts]
guardian = "guardian_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
